<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1640" viewBox="0 0 1500 1640" role="img" aria-labelledby="title description">
<title id="title">Gen3D-Edu System Architecture</title>
<desc id="description">A conventional system architecture diagram showing learner input, React frontend, FastAPI backend, Gemini and optional OpenAI generation, structured plan validation, SQLite lesson storage, 2D and 3D rendering, playback and voice narration.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#39485b"/></marker>
  <marker id="arrowLight" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#68788b"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}
    .title{font-size:30px;font-weight:700;letter-spacing:.2px}
    .subtitle{font-size:15px;fill:#526174}
    .section{font-size:17px;font-weight:700;letter-spacing:.3px}
    .label{font-size:16px;font-weight:700}
    .small{font-size:13px;fill:#526174}
    .tiny{font-size:12px;fill:#526174}
    .box{fill:#fff;stroke:#536274;stroke-width:1.6}
    .group{fill:#fbfcfd;stroke:#8592a1;stroke-width:1.4}
    .head{fill:#edf1f5;stroke:#536274;stroke-width:1.5}
    .external{fill:#f8fafb;stroke:#6d7b8c;stroke-width:1.5;stroke-dasharray:7 5}
    .line{fill:none;stroke:#39485b;stroke-width:1.8;marker-end:url(#arrow)}
    .back{fill:none;stroke:#68788b;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrowLight)}
  </style>
</defs>
<rect width="1500" height="1640" fill="#ffffff"/>
<text x="750" y="58" text-anchor="middle" class="title">Gen3D-Edu — System Architecture</text>
<text x="750" y="86" text-anchor="middle" class="subtitle">Natural-language questions become validated, interactive visual lessons</text>

<!-- User -->
<rect x="550" y="112" width="400" height="58" rx="8" class="box"/>
<text x="750" y="137" text-anchor="middle" class="label">Learner</text>
<text x="750" y="157" text-anchor="middle" class="small">Enters an educational question · controls lesson playback</text>

<!-- Frontend input -->
<rect x="92" y="205" width="1316" height="216" rx="10" class="group"/>
<rect x="92" y="205" width="1316" height="42" rx="10" class="head"/>
<path d="M92 237 H1408" stroke="#536274" stroke-width="1.5"/>
<text x="750" y="233" text-anchor="middle" class="section">WEB APPLICATION · REACT + VITE</text>
<rect x="130" y="276" width="340" height="105" rx="7" class="box"/>
<text x="300" y="307" text-anchor="middle" class="label">Account &amp; Dashboard</text>
<text x="300" y="332" text-anchor="middle" class="small">Sign in · lesson history · pinned lessons</text>
<text x="300" y="354" text-anchor="middle" class="small">Library JSON backup and restore</text>
<rect x="580" y="276" width="340" height="105" rx="7" class="box"/>
<text x="750" y="307" text-anchor="middle" class="label">Lesson Prompt</text>
<text x="750" y="332" text-anchor="middle" class="small">Text entry or browser speech input</text>
<text x="750" y="354" text-anchor="middle" class="small">Sends authenticated request to the API</text>
<rect x="1030" y="276" width="340" height="105" rx="7" class="box"/>
<text x="1200" y="307" text-anchor="middle" class="label">Lesson Player</text>
<text x="1200" y="332" text-anchor="middle" class="small">2D / 3D view · steps · playback speed</text>
<text x="1200" y="354" text-anchor="middle" class="small">Voice narration · saved lesson opening</text>
<path d="M470 328 H570" class="line"/>
<path d="M920 328 H1020" class="line"/>
<path d="M750 171 V266" class="line"/>

<!-- Backend group -->
<rect x="92" y="466" width="1316" height="812" rx="10" class="group"/>
<rect x="92" y="466" width="1316" height="42" rx="10" class="head"/>
<path d="M92 498 H1408" stroke="#536274" stroke-width="1.5"/>
<text x="750" y="494" text-anchor="middle" class="section">APPLICATION BACKEND · FASTAPI</text>
<rect x="510" y="534" width="480" height="73" rx="7" class="box"/>
<text x="750" y="563" text-anchor="middle" class="label">REST API</text>
<text x="750" y="585" text-anchor="middle" class="small">Receives prompts · returns lessons · serves history</text>
<path d="M750 381 V524" class="line"/>
<text x="767" y="451" class="tiny">HTTPS / JSON</text>
<rect x="510" y="630" width="480" height="76" rx="7" class="box"/>
<text x="750" y="660" text-anchor="middle" class="label">Authentication &amp; Request Checks</text>
<text x="750" y="683" text-anchor="middle" class="small">Signed HTTP-only session · prompt and user validation</text>
<path d="M750 607 V620" class="line"/>
<rect x="510" y="729" width="480" height="78" rx="7" class="box"/>
<text x="750" y="760" text-anchor="middle" class="label">Lesson Generation Service</text>
<text x="750" y="783" text-anchor="middle" class="small">Selects a deterministic demo or an LLM provider</text>
<path d="M750 706 V719" class="line"/>

<!-- Provider branches -->
<rect x="145" y="844" width="330" height="108" rx="7" class="box"/>
<text x="310" y="876" text-anchor="middle" class="label">Built-in Topic Demo</text>
<text x="310" y="901" text-anchor="middle" class="small">Known supported algorithms / concepts</text>
<text x="310" y="923" text-anchor="middle" class="small">Uses deterministic plan templates</text>
<rect x="585" y="844" width="330" height="108" rx="7" class="external"/>
<text x="750" y="876" text-anchor="middle" class="label">Gemini · Primary LLM</text>
<text x="750" y="901" text-anchor="middle" class="small">Produces structured AnimationPlan JSON</text>
<text x="750" y="923" text-anchor="middle" class="small">Tries configured model IDs within a time limit</text>
<rect x="1025" y="844" width="330" height="108" rx="7" class="external"/>
<text x="1190" y="876" text-anchor="middle" class="label">OpenAI · Optional Backup</text>
<text x="1190" y="901" text-anchor="middle" class="small">Used when configured and Gemini fails</text>
<text x="1190" y="923" text-anchor="middle" class="small">Returns the same typed plan structure</text>
<path d="M750 807 V826 H310 V834" class="line"/>
<path d="M750 807 V834" class="line"/>
<path d="M750 807 V826 H1190 V834" class="back"/>
<text x="1053" y="819" class="tiny">provider failover</text>

<!-- Plan and validation -->
<rect x="510" y="986" width="480" height="78" rx="7" class="box"/>
<text x="750" y="1017" text-anchor="middle" class="label">Typed AnimationPlan</text>
<text x="750" y="1040" text-anchor="middle" class="small">Concept · scene objects · transforms · step actions</text>
<path d="M310 952 V972 H750 V976" class="line"/>
<path d="M750 952 V976" class="line"/>
<path d="M1190 952 V972 H750 V976" class="back"/>
<rect x="510" y="1085" width="480" height="88" rx="7" class="box"/>
<text x="750" y="1117" text-anchor="middle" class="label">Plan Validation</text>
<text x="750" y="1141" text-anchor="middle" class="small">Pydantic schema + semantic and reference checks</text>
<text x="750" y="1161" text-anchor="middle" class="tiny">One bounded correction attempt · reject invalid plans</text>
<path d="M750 1064 V1075" class="line"/>
<path d="M510 1128 H430 V768 H500" class="back"/>
<text x="357" y="1014" class="tiny" transform="rotate(-90 357 1014)">correct plan when validation fails</text>

<!-- Persistence, within backend -->
<rect x="1040" y="1010" width="310" height="142" rx="7" class="box"/>
<text x="1195" y="1043" text-anchor="middle" class="label">SQLite Database</text>
<text x="1195" y="1068" text-anchor="middle" class="small">Users · prompts · validated lesson plans</text>
<text x="1195" y="1090" text-anchor="middle" class="small">Creation dates · pinned state</text>
<text x="1195" y="1123" text-anchor="middle" class="tiny">Private lesson records scoped to account</text>
<path d="M990 1129 H1030" class="line"/>
<text x="1000" y="1115" class="tiny">save</text>

<!-- Response and render -->
<rect x="510" y="1200" width="480" height="58" rx="7" class="head"/>
<text x="750" y="1236" text-anchor="middle" class="label">Validated plan returned to the browser</text>
<path d="M750 1173 V1190" class="line"/>

<!-- Browser render layer -->
<rect x="92" y="1324" width="1316" height="242" rx="10" class="group"/>
<rect x="92" y="1324" width="1316" height="42" rx="10" class="head"/>
<path d="M92 1356 H1408" stroke="#536274" stroke-width="1.5"/>
<text x="750" y="1352" text-anchor="middle" class="section">BROWSER VISUALIZATION &amp; LEARNING CONTROLS</text>
<rect x="145" y="1390" width="340" height="96" rx="7" class="box"/>
<text x="315" y="1421" text-anchor="middle" class="label">2D Lesson Renderer</text>
<text x="315" y="1446" text-anchor="middle" class="small">Interactive plan scene and step highlights</text>
<text x="315" y="1468" text-anchor="middle" class="tiny">React components · SVG / HTML</text>
<rect x="585" y="1390" width="330" height="96" rx="7" class="box"/>
<text x="750" y="1421" text-anchor="middle" class="label">3D Lesson Renderer</text>
<text x="750" y="1446" text-anchor="middle" class="small">React Three Fiber · Three.js</text>
<text x="750" y="1468" text-anchor="middle" class="tiny">Semantic objects built from validated plan</text>
<rect x="1025" y="1390" width="330" height="96" rx="7" class="box"/>
<text x="1190" y="1421" text-anchor="middle" class="label">Synchronized Playback</text>
<text x="1190" y="1446" text-anchor="middle" class="small">Step · pause · replay · speed · narration</text>
<text x="1190" y="1468" text-anchor="middle" class="tiny">Browser speech synthesis</text>
<path d="M750 1258 V1308 H315 V1380" class="line"/>
<path d="M750 1308 V1380" class="line"/>
<path d="M750 1308 H1190 V1380" class="line"/>

<!-- Build-time asset note -->
<rect x="180" y="1590" width="1140" height="35" rx="5" class="external"/>
<text x="750" y="1613" text-anchor="middle" class="tiny">Projectile-motion asset path: Blender creates a reusable GLB scene at build time; the browser loads it for the projectile lesson. Other semantic 3D lessons are rendered in the browser.</text>
</svg>